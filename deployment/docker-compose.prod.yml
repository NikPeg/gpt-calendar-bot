services:
  gpt-calendar-bot:
    image: cr.yandex/${YC_REGISTRY_ID}/gpt-calendar-bot:latest
    container_name: gpt-calendar-bot
    # restart: unless-stopped - перезапуск при ошибках (единственный механизм)
    # Внутри контейнера НЕТ автоматического перезапуска!
    restart: unless-stopped
    # ВНИМАНИЕ: network_mode: host делает процессы контейнера видимыми на хосте
    # При остановке/перезапуске контейнера процессы могут остаться висеть на хосте
    # Скрипт деплоя автоматически убивает процессы-зомби, но при ручной остановке
    # используйте: sudo pkill -f "python -u main.py"
    network_mode: host
    env_file:
      - .env
    volumes:
      # Монтируем директорию для сохранения базы данных и логов
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - DATABASE_NAME=/data/users.db
    # Healthcheck - проверяем HTTP endpoint OAuth сервера
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

