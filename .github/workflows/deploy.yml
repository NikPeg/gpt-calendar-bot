name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main

env:
  REGISTRY: cr.yandex
  IMAGE_NAME: gpt-calendar-bot

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt
          pip install -r requirements/requirements-dev.txt

      - name: Run linter
        run: ruff check .

      - name: Run tests
        env:
          FILE_LOG_LEVEL: DISABLED
        run: pytest tests/ -v --tb=short

      - name: Validate JSON configs
        run: |
          python -c "import json; json.load(open('config/messages.json'))"

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        run: |
          # Сохраняем JSON ключ во временный файл
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > /tmp/key.json

          # Логинимся используя docker и yc CLI
          cat /tmp/key.json | docker login \
            --username json_key \
            --password-stdin \
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}

          # Удаляем временный файл
          rm /tmp/key.json

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}"

          # Собираем образ из deployment директории
          docker build -f deployment/Dockerfile -t ${IMAGE_TAG}:latest -t ${IMAGE_TAG}:${{ github.sha }} .

          # Пушим оба тега
          docker push ${IMAGE_TAG}:latest
          docker push ${IMAGE_TAG}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment/docker-compose.prod.yml"
          target: "~/gpt-calendar-bot/"
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
          ADMIN_CHAT: ${{ secrets.ADMIN_CHAT }}
          MODEL: ${{ secrets.MODEL || 'google/gemini-2.0-flash-exp:free' }}
          MAX_CONTEXT: ${{ secrets.MAX_CONTEXT || '20' }}
          MAX_STORAGE: ${{ secrets.MAX_STORAGE || '100' }}
          FEEDBACK_FORM_URL: ${{ secrets.FEEDBACK_FORM_URL || '' }}
          REQUIRED_CHANNELS: ${{ secrets.REQUIRED_CHANNELS || '' }}
          FILE_LOG_LEVEL: ${{ secrets.FILE_LOG_LEVEL || 'INFO' }}
          TELEGRAM_LOG_LEVEL: ${{ secrets.TELEGRAM_LOG_LEVEL || 'DISABLED' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI || '' }}
          OAUTH_SERVER_PORT: ${{ secrets.OAUTH_SERVER_PORT || '8080' }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          BACKUP_IMAGE: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:stable
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TG_TOKEN,LLM_TOKEN,ADMIN_CHAT,MODEL,MAX_CONTEXT,MAX_STORAGE,FEEDBACK_FORM_URL,REQUIRED_CHANNELS,FILE_LOG_LEVEL,TELEGRAM_LOG_LEVEL,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REDIRECT_URI,OAUTH_SERVER_PORT,YC_REGISTRY_ID,NEW_IMAGE,BACKUP_IMAGE
          script: |
            set -e  # Остановка при ошибке

            echo "🔄 Начинаем деплой..."

            # Создаем директории если их нет
            export DEPLOY_DIR="$HOME/gpt-calendar-bot"
            mkdir -p "$DEPLOY_DIR/data" "$DEPLOY_DIR/logs"
            echo "📁 Директория деплоя: $DEPLOY_DIR"

            # Сохраняем информацию о текущем работающем контейнере
            CURRENT_IMAGE=""
            if docker ps --filter name=gpt-calendar-bot --format "{{.Image}}" | grep -q .; then
              CURRENT_IMAGE=$(docker ps --filter name=gpt-calendar-bot --format "{{.Image}}")
              echo "📸 Текущий образ: $CURRENT_IMAGE"

              # Тегируем текущий образ как stable (резервная копия)
              docker tag "$CURRENT_IMAGE" "$BACKUP_IMAGE" || echo "⚠️  Не удалось создать backup тег"
            else
              echo "⚠️  Текущий контейнер не найден"
            fi

            # Обновляем новый образ
            echo "⬇️  Скачиваем новый образ..."
            docker pull "$NEW_IMAGE"

            # Останавливаем и удаляем текущий контейнер
            echo "⏸️  Останавливаем текущий контейнер..."
            
            # Получаем ID всех контейнеров с именем gpt-calendar-bot (включая остановленные)
            CONTAINER_IDS=$(docker ps -a --filter name=gpt-calendar-bot --format "{{.ID}}" || true)
            
            if [ -n "$CONTAINER_IDS" ]; then
              echo "🗑️  Найдены контейнеры для удаления: $CONTAINER_IDS"
              for CONTAINER_ID in $CONTAINER_IDS; do
                echo "  Отключаем автоперезапуск для $CONTAINER_ID..."
                docker update --restart=no "$CONTAINER_ID" 2>/dev/null || true
                
                # Получаем PID процесса контейнера
                CONTAINER_PID=$(docker inspect "$CONTAINER_ID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                
                if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                  echo "  Убиваем процесс контейнера $CONTAINER_ID (PID: $CONTAINER_PID)..."
                  sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                  sleep 1
                else
                  echo "  Процесс контейнера $CONTAINER_ID не найден или уже остановлен"
                fi
                
                echo "  Удаляем контейнер $CONTAINER_ID..."
                docker rm -f "$CONTAINER_ID" 2>/dev/null || true
              done
              sleep 2
            fi
            
            # Финальная проверка
            if docker ps -a --filter name=gpt-calendar-bot --format "{{.Names}}" | grep -q gpt-calendar-bot; then
              echo "⚠️  Контейнер все еще существует, применяем экстренные меры..."
              
              # Последняя попытка - убить все процессы и принудительно удалить
              REMAINING_IDS=$(docker ps -a --filter name=gpt-calendar-bot --format "{{.ID}}")
              for CONTAINER_ID in $REMAINING_IDS; do
                CONTAINER_PID=$(docker inspect "$CONTAINER_ID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                  echo "  Экстренно убиваем PID: $CONTAINER_PID..."
                  sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                fi
                sleep 1
                docker rm -f "$CONTAINER_ID" 2>/dev/null || true
              done
              sleep 2
              
              # Финальная-финальная проверка
              if docker ps -a --filter name=gpt-calendar-bot --format "{{.Names}}" | grep -q gpt-calendar-bot; then
                echo "❌ ОШИБКА: Контейнер все еще существует после всех попыток!"
                docker ps -a --filter name=gpt-calendar-bot
                exit 1
              fi
            fi
            
            echo "✅ Все старые контейнеры удалены"

            # Функция для запуска контейнера через docker-compose
            start_container() {
              echo "🚀 Запускаем контейнер через docker-compose..."
              
              # Убеждаемся что старый контейнер полностью убит
              OLD_CONTAINERS=$(docker ps -a --filter name=gpt-calendar-bot --format "{{.ID}}" || true)
              if [ -n "$OLD_CONTAINERS" ]; then
                echo "⚠️  Найдены остатки старых контейнеров, удаляем..."
                for CID in $OLD_CONTAINERS; do
                  # Убиваем процесс
                  OLD_PID=$(docker inspect "$CID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                  if [ -n "$OLD_PID" ] && [ "$OLD_PID" != "0" ]; then
                    echo "  Убиваем PID: $OLD_PID"
                    sudo kill -9 "$OLD_PID" 2>/dev/null || true
                  fi
                  sleep 1
                  # Удаляем контейнер
                  docker rm -f "$CID" 2>/dev/null || true
                done
                sleep 2
              fi
              
              # Проверяем и освобождаем порт 8080
              echo "🔍 Проверяем порт 8080..."
              PORT_PIDS=$(sudo lsof -ti:8080 2>/dev/null || true)
              if [ -n "$PORT_PIDS" ]; then
                echo "⚠️  Порт 8080 занят процессами: $PORT_PIDS"
                for PID in $PORT_PIDS; do
                  echo "  Убиваем процесс на порту 8080: $PID"
                  sudo kill -9 "$PID" 2>/dev/null || true
                done
                sleep 2
                echo "✅ Порт 8080 освобожден"
              else
                echo "✅ Порт 8080 свободен"
              fi
              
              # Очищаем Docker сети и контейнеры через docker-compose
              echo "🧹 Очищаем Docker сети и контейнеры..."
              cd "$DEPLOY_DIR"
              
              # Используем docker-compose down для правильной очистки сетей
              if [ -f docker-compose.prod.yml ]; then
                echo "  Выполняем docker-compose down для очистки..."
                sudo docker-compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
                sleep 2
              fi
              
              # Удаляем старую сеть проекта если она все еще существует
              EXISTING_NETWORK=$(docker network ls --filter name=gpt-calendar-bot --format "{{.Name}}" || true)
              if [ -n "$EXISTING_NETWORK" ]; then
                echo "  Удаляем существующую сеть: $EXISTING_NETWORK"
                docker network rm "$EXISTING_NETWORK" 2>/dev/null || true
                sleep 1
              fi
              
              # Очищаем неиспользуемые сети
              echo "  Удаляем неиспользуемые Docker сети..."
              docker network prune -f 2>/dev/null || true
              
              # Исправляем iptables правила для Docker
              echo "  Исправляем правила iptables для Docker..."
              
              # Проверяем и создаем необходимые цепочки iptables для Docker
              if ! sudo iptables -t filter -L DOCKER-ISOLATION-STAGE-2 >/dev/null 2>&1; then
                echo "  Создаем цепочку DOCKER-ISOLATION-STAGE-2..."
                sudo iptables -t filter -N DOCKER-ISOLATION-STAGE-2 2>/dev/null || true
                sudo iptables -t filter -A DOCKER-ISOLATION-STAGE-2 -j RETURN 2>/dev/null || true
              fi
              
              if ! sudo iptables -t filter -L DOCKER-ISOLATION-STAGE-1 >/dev/null 2>&1; then
                echo "  Создаем цепочку DOCKER-ISOLATION-STAGE-1..."
                sudo iptables -t filter -N DOCKER-ISOLATION-STAGE-1 2>/dev/null || true
              fi
              
              # Создаем .env файл со всеми переменными окружения
              echo "📝 Создаем .env файл..."
              {
                echo "TG_TOKEN=$TG_TOKEN"
                echo "LLM_TOKEN=$LLM_TOKEN"
                echo "ADMIN_CHAT=$ADMIN_CHAT"
                echo "MODEL=$MODEL"
                echo "MAX_CONTEXT=$MAX_CONTEXT"
                echo "MAX_STORAGE=$MAX_STORAGE"
                echo "REQUIRED_CHANNELS=$REQUIRED_CHANNELS"
                echo "FILE_LOG_LEVEL=$FILE_LOG_LEVEL"
                echo "TELEGRAM_LOG_LEVEL=$TELEGRAM_LOG_LEVEL"
                echo "GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID"
                echo "GOOGLE_OAUTH_CLIENT_SECRET=$GOOGLE_OAUTH_CLIENT_SECRET"
                echo "GOOGLE_OAUTH_REDIRECT_URI=$GOOGLE_OAUTH_REDIRECT_URI"
                echo "OAUTH_SERVER_PORT=$OAUTH_SERVER_PORT"
                echo "YC_REGISTRY_ID=$YC_REGISTRY_ID"
              } > "$DEPLOY_DIR/.env"
              
              # Запускаем через docker-compose
              echo "🚀 Запускаем docker-compose up..."
              sudo docker-compose -f docker-compose.prod.yml up -d
            }

            # Запускаем новый контейнер
            echo "📦 Используем образ: $NEW_IMAGE"
            if start_container; then
              echo "✅ Контейнер запущен"
            else
              echo "❌ Ошибка запуска контейнера"
              exit 1
            fi

            # Ждем пока контейнер станет healthy (максимум 90 секунд)
            echo "⏳ Ожидаем запуска и проверки healthcheck (до 90 секунд)..."
            HEALTH_CHECK_TIMEOUT=90
            HEALTH_CHECK_INTERVAL=5
            ELAPSED=0
            
            while [ $ELAPSED -lt $HEALTH_CHECK_TIMEOUT ]; do
              HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' gpt-calendar-bot 2>/dev/null || echo "none")
              
              if [ "$HEALTH_STATUS" = "healthy" ]; then
                echo "✅ Контейнер здоров (healthy)"
                break
              elif [ "$HEALTH_STATUS" = "none" ]; then
                # Контейнер без healthcheck или не запущен
                if docker ps --filter name=gpt-calendar-bot --filter status=running | grep -q gpt-calendar-bot; then
                  echo "ℹ️  Контейнер работает (healthcheck не настроен)"
                  break
                else
                  echo "❌ Контейнер не запущен"
                  break
                fi
              else
                echo "⏳ Статус: $HEALTH_STATUS (прошло ${ELAPSED}с)"
                sleep $HEALTH_CHECK_INTERVAL
                ELAPSED=$((ELAPSED + HEALTH_CHECK_INTERVAL))
              fi
            done
            
            # Финальная проверка статуса
            FINAL_HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' gpt-calendar-bot 2>/dev/null || echo "none")
            CONTAINER_RUNNING=$(docker ps --filter name=gpt-calendar-bot --filter status=running | grep -q gpt-calendar-bot && echo "yes" || echo "no")
            
            if [ "$FINAL_HEALTH_STATUS" != "healthy" ] && [ "$FINAL_HEALTH_STATUS" != "none" ]; then
              echo "❌ Контейнер не прошел healthcheck за ${HEALTH_CHECK_TIMEOUT} секунд!"
              echo "Финальный статус: $FINAL_HEALTH_STATUS"
              docker logs gpt-calendar-bot --tail=50
              
              # Откатываемся к стабильной версии
              if [ -n "$CURRENT_IMAGE" ]; then
                echo "🔙 Откатываемся к предыдущей версии из-за проблем с healthcheck"
                
                # Получаем PID процесса и убиваем его
                CONTAINER_PID=$(docker inspect gpt-calendar-bot --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                  sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                  sleep 1
                fi
                
                docker stop gpt-calendar-bot 2>/dev/null || true
                docker rm -f gpt-calendar-bot 2>/dev/null || true
                
                # Перетегируем backup образ как latest для docker-compose
                echo "📦 Перетегируем $BACKUP_IMAGE -> $NEW_IMAGE"
                docker tag "$BACKUP_IMAGE" "$NEW_IMAGE" || echo "⚠️ Не удалось перетегировать"
                
                start_container
                sleep 10
                echo "🔄 Откат выполнен. Проверьте логи:"
                docker logs gpt-calendar-bot --tail=30
                exit 1
              else
                echo "⚠️  Нет предыдущей версии для отката!"
                exit 1
              fi
            fi
            
            if [ "$CONTAINER_RUNNING" = "yes" ]; then
              echo "✅ Контейнер работает"

              # Проверяем успешность миграций (или их отсутствие)
              LOGS=$(docker logs gpt-calendar-bot 2>&1 | tail -100)

              # Миграции считаются успешными если:
              # 1. Все миграции применены успешно
              # 2. Миграций не найдено (нечего применять)
              # Миграции считаются провалившимися если есть ошибка при их применении
              if echo "$LOGS" | grep -q "❌.*миграци\|Ошибка при применении миграции"; then
                echo "❌ Миграции не были применены успешно!"
                echo "$LOGS" | grep -A 5 "миграц"
                
                # Откатываемся к стабильной версии
                if [ -n "$CURRENT_IMAGE" ]; then
                  echo "🔙 Откатываемся к предыдущей версии: $CURRENT_IMAGE"
                  
                  # Получаем PID процесса и убиваем его
                  CONTAINER_PID=$(docker inspect gpt-calendar-bot --format '{{.State.Pid}}' 2>/dev/null || echo "")
                  if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                    sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                    sleep 1
                  fi
                  
                  docker stop gpt-calendar-bot 2>/dev/null || true
                  docker rm -f gpt-calendar-bot 2>/dev/null || true
                  
                  # Перетегируем backup образ как latest для docker-compose
                  echo "📦 Перетегируем $BACKUP_IMAGE -> $NEW_IMAGE"
                  docker tag "$BACKUP_IMAGE" "$NEW_IMAGE" || echo "⚠️ Не удалось перетегировать"
                  
                  start_container
                  sleep 10
                  echo "🔄 Откат выполнен. Проверьте логи:"
                  docker logs gpt-calendar-bot --tail=30
                  exit 1
                else
                  echo "⚠️  Нет предыдущей версии для отката!"
                  docker logs gpt-calendar-bot --tail=50
                  exit 1
                fi
              else
                echo "✅ Миграции успешны (применены или отсутствуют)"
              fi

              # Проверяем логи на наличие критических ошибок запуска
              if echo "$LOGS" | grep -iE "CRITICAL|ERROR.*Failed to|Exception.*startup"; then
                echo "❌ Обнаружены критические ошибки в логах!"
                
                # Откатываемся к стабильной версии
                if [ -n "$CURRENT_IMAGE" ]; then
                  echo "🔙 Откатываемся к предыдущей версии: $CURRENT_IMAGE"
                  
                  # Получаем PID процесса и убиваем его
                  CONTAINER_PID=$(docker inspect gpt-calendar-bot --format '{{.State.Pid}}' 2>/dev/null || echo "")
                  if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                    sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                    sleep 1
                  fi
                  
                  docker stop gpt-calendar-bot 2>/dev/null || true
                  docker rm -f gpt-calendar-bot 2>/dev/null || true
                  
                  # Перетегируем backup образ как latest для docker-compose
                  echo "📦 Перетегируем $BACKUP_IMAGE -> $NEW_IMAGE"
                  docker tag "$BACKUP_IMAGE" "$NEW_IMAGE" || echo "⚠️ Не удалось перетегировать"
                  
                  start_container
                  sleep 10
                  echo "🔄 Откат выполнен. Проверьте логи:"
                  docker logs gpt-calendar-bot --tail=30
                  exit 1
                else
                  echo "⚠️  Нет предыдущей версии для отката!"
                  docker logs gpt-calendar-bot --tail=50
                  exit 1
                fi
              else
                echo "✅ Деплой успешен!"
                docker logs gpt-calendar-bot --tail=30
                echo "📊 Статус контейнера:"
                docker ps --filter name=gpt-calendar-bot
              fi
            else
              echo "❌ Контейнер не работает!"
              
              # Откатываемся к стабильной версии
              if [ -n "$CURRENT_IMAGE" ]; then
                echo "🔙 Откатываемся к предыдущей версии: $CURRENT_IMAGE"
                
                # Получаем PID процесса и убиваем его
                CONTAINER_PID=$(docker inspect gpt-calendar-bot --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CONTAINER_PID" ] && [ "$CONTAINER_PID" != "0" ]; then
                  sudo kill -9 "$CONTAINER_PID" 2>/dev/null || true
                  sleep 1
                fi
                
                docker stop gpt-calendar-bot 2>/dev/null || true
                docker rm -f gpt-calendar-bot 2>/dev/null || true
                
                # Перетегируем backup образ как latest для docker-compose
                echo "📦 Перетегируем $BACKUP_IMAGE -> $NEW_IMAGE"
                docker tag "$BACKUP_IMAGE" "$NEW_IMAGE" || echo "⚠️ Не удалось перетегировать"
                
                start_container
                sleep 10
                echo "🔄 Откат выполнен"
                docker logs gpt-calendar-bot --tail=30
              else
              echo "⚠️  Нет предыдущей версии для отката!"
              docker logs gpt-calendar-bot --tail=50
              fi
              exit 1
            fi

      - name: Final verification
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔍 Финальная проверка..."

            if docker ps --filter name=gpt-calendar-bot --filter status=running | grep -q gpt-calendar-bot; then
              echo "✅ Бот работает"
              echo ""
              echo "📊 Информация о контейнере:"
              docker ps --filter name=gpt-calendar-bot --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
              echo ""
              echo "📝 Последние логи:"
              docker logs gpt-calendar-bot --tail=20
            else
              echo "❌ ВНИМАНИЕ: Бот не работает!"
              echo ""
              echo "📝 Последние логи:"
              docker logs gpt-calendar-bot --tail=50 2>&1 || echo "Логи недоступны"
              exit 1
            fi

  notify:
    name: Send Telegram Notification
    needs: [test, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Send notification
        run: |
          echo "=========================================="
          echo "📊 Статусы jobs:"
          echo "=========================================="
          
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Определяем статусы каждого job
          TEST_STATUS="${{ needs.test.result }}"
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          
          echo "Test:         $TEST_STATUS"
          echo "Build:        $BUILD_STATUS"
          echo "Deploy:       $DEPLOY_STATUS"
          echo "Commit:       $COMMIT_SHA - $COMMIT_MSG"
          echo "=========================================="
          
          # Функция для форматирования статуса
          format_status() {
            local status=$1
            local name=$2
            case "$status" in
              "success")
                echo "✅ <b>${name}:</b> успешно"
                ;;
              "failure")
                echo "❌ <b>${name}:</b> ошибка"
                ;;
              "cancelled")
                echo "⚠️ <b>${name}:</b> отменен"
                ;;
              "skipped")
                echo "⏭️ <b>${name}:</b> пропущен"
                ;;
              *)
                echo "❓ <b>${name}:</b> ${status:-неизвестно}"
                ;;
            esac
          }
          
          # Формируем сообщение
          # Проверяем, все ли jobs успешны
          ALL_SUCCESS=true
          if [ "$TEST_STATUS" != "success" ]; then
            ALL_SUCCESS=false
            echo "⚠️  Test job не успешен: $TEST_STATUS"
          fi
          if [ "$BUILD_STATUS" != "success" ]; then
            ALL_SUCCESS=false
            echo "⚠️  Build job не успешен: $BUILD_STATUS"
          fi
          if [ "$DEPLOY_STATUS" != "success" ]; then
            ALL_SUCCESS=false
            echo "⚠️  Deploy job не успешен: $DEPLOY_STATUS"
          fi
          
          if [ "$ALL_SUCCESS" = "true" ]; then
            EMOJI="✅"
            TITLE="<b>Деплой успешно завершен!</b>"
            STATUS_TEXT="Все этапы пройдены успешно"
            echo "✅ Все jobs успешны"
          else
            EMOJI="❌"
            TITLE="<b>Деплой завершился с ошибкой!</b>"
            STATUS_TEXT=""
            
            STATUS_TEXT="${STATUS_TEXT}$(format_status "${TEST_STATUS}" "Тесты/Линтер")%0A"
            STATUS_TEXT="${STATUS_TEXT}$(format_status "${BUILD_STATUS}" "Сборка")%0A"
            STATUS_TEXT="${STATUS_TEXT}$(format_status "${DEPLOY_STATUS}" "Деплой")%0A"
            echo "❌ Workflow завершился с ошибками"
          fi
          
          MESSAGE="${EMOJI} ${TITLE}%0A%0ACommit: <code>${COMMIT_SHA}</code>%0A${COMMIT_MSG}%0A%0A${STATUS_TEXT}%0A<a href='${WORKFLOW_URL}'>Проверить в Actions</a>"
          
          echo "=========================================="
          echo "📤 Отправка уведомления в Telegram..."
          echo "Chat ID: ${{ secrets.ADMIN_CHAT }}"
          echo "=========================================="
          
          # Отправляем уведомление и сохраняем ответ
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ADMIN_CHAT }}" \
            -d "parse_mode=HTML" \
            -d "text=${MESSAGE}")
          
          # Разделяем ответ на тело и HTTP код
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP код: $HTTP_CODE"
          echo "Ответ API: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "=========================================="
            echo "❌ ОШИБКА: Не удалось отправить уведомление в Telegram"
            echo "HTTP код: $HTTP_CODE"
            echo "Ответ: $RESPONSE_BODY"
            echo "=========================================="
            echo ""
            echo "Возможные причины:"
            echo "1. Неверный TG_TOKEN"
            echo "2. Неверный ADMIN_CHAT (для групп должен начинаться с -)"
            echo "3. Бот не добавлен в чат"
            echo "4. У бота нет прав на отправку сообщений"
            echo "=========================================="
            exit 1
          fi
          
          echo "✅ Уведомление успешно отправлено"
          
          # ВАЖНО: Завершаем job с ошибкой если workflow провалился
          # Это обеспечит красный крестик в GitHub Actions
          if [ "$ALL_SUCCESS" != "true" ]; then
            echo "=========================================="
            echo "❌ Workflow завершился с ошибкой"
            echo "Завершаем notify job с кодом ошибки"
            echo "=========================================="
            exit 1
          fi
          
          echo "=========================================="
          echo "✅ Workflow выполнен успешно"
          echo "=========================================="

